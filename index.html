
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bora cineminha? 🎬❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  background:#ffc8dd; font-family:Arial,sans-serif;
  display:flex; align-items:center; justify-content:center;
}
.card{
  width:min(92%,560px); padding:40px 22px;
  text-align:center; background:rgba(255,255,255,.28);
  border-radius:28px; box-shadow:0 12px 35px rgba(89,13,34,.18);
  backdrop-filter:blur(4px);
}
.emoji{font-size:54px}
h1{color:#590d22;font-size:clamp(30px,8vw,48px);margin:16px 0 12px}
p{color:#800f2f;font-size:19px;margin-bottom:28px}
.area{position:relative;height:190px}
button{
  border:0;border-radius:14px;padding:14px 30px;
  font-size:20px;font-weight:700;cursor:pointer;
  box-shadow:0 5px 12px rgba(0,0,0,.16);
}
#sim{background:#ff8fab;color:#590d22}
#nao{
  position:absolute;left:50%;top:95px;
  transform:translateX(-50%);
  background:#ffb3c1;color:#590d22;
}
#nao:hover{transform:scale(1.06)}
#resultado{
  display:none;color:#590d22;font-size:25px;
  font-weight:700;line-height:1.45;
}
.coracao{
  position:fixed; bottom:-30px; font-size:24px;
  animation:subir 4s linear forwards; pointer-events:none;
}
@keyframes subir{
  0%{transform:translateY(0) rotate(0);opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🎬🍿❤️</div>
  <h1 id="titulo">Bora cineminha?</h1>
  <p id="subtitulo">Prometo escolher um filme bom... talvez 😏</p>

  <div class="area" id="area">
    <button id="sim">Sim ❤️</button>
    <button id="nao">Não 😅</button>
  </div>

  <div id="resultado">
    Opa! Então fechou! 😎❤️<br>
    <span style="font-size:19px">Agora só falta escolher o filme e o horário. 🍿🎬</span>
  </div>
</div>

<script>
const area=document.getElementById("area");
const nao=document.getElementById("nao");
const sim=document.getElementById("sim");
const titulo=document.getElementById("titulo");
const subtitulo=document.getElementById("subtitulo");
const resultado=document.getElementById("resultado");

function fugir(){
  const maxX=area.clientWidth-nao.offsetWidth;
  const maxY=area.clientHeight-nao.offsetHeight;
  nao.style.left=Math.max(0,Math.random()*maxX)+"px";
  nao.style.top=Math.max(0,Math.random()*maxY)+"px";
  nao.style.transform="none";
}

nao.addEventListener("mouseenter",fujaComUmPoucoDeDesespero);
nao.addEventListener("touchstart",function(e){e.preventDefault();fugir()});

function fujaComUmPoucoDeDesespero(){ fugir(); }

sim.addEventListener("click",()=>{
  titulo.textContent="Sabia que você ia aceitar! 😍";
  subtitulo.style.display="none";
  area.style.display="none";
  resultado.style.display="block";
  for(let i=0;i<20;i++){
    setTimeout(()=>{
      const c=document.createElement("div");
      c.className="coracao";
      c.textContent=["❤️","💕","💗","💖"][Math.floor(Math.random()*4)];
      c.style.left=Math.random()*100+"vw";
      c.style.animationDuration=(2.5+Math.random()*2.5)+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),5000);
    },i*100);
  }
});
</script>
</body>
</html>
